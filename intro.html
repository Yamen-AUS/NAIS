<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>NAIS Dubai – Welcome</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0B1230;
      font-family: 'Montserrat', Arial Black, sans-serif;
    }

    /* ── Wrapper ── */
    #intro-wrap {
      position: fixed;
      inset: 0;
      z-index: 9999;
      opacity: 1;
      transition: opacity 1.2s ease;
    }
    #intro-wrap.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* ── Canvas fills the screen (background only) ── */
    #intro-canvas {
      display: block;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* ── Overlay layer on top of canvas ── */
    #intro-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      pointer-events: none;
    }

    /* ── Words block ── */
    #intro-words {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      margin-bottom: 28px;
    }

    .intro-word {
      font-family: 'Montserrat', Arial Black, sans-serif;
      font-weight: 900;
      font-size: clamp(52px, 10vw, 120px);
      line-height: 1.05;
      color: #ffffff;
      text-shadow: 0 4px 32px rgba(0,0,0,0.7);
      text-align: center;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.55s ease, transform 0.55s cubic-bezier(0.34,1.56,0.64,1);
      white-space: nowrap;
    }
    .intro-word.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── Tagline ── */
    #intro-tagline {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: clamp(8px, 1.1vw, 13px);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.82);
      text-align: center;
      opacity: 0;
      transition: opacity 0.6s ease;
      margin-bottom: 10px;
    }
    #intro-tagline.visible { opacity: 1; }

    /* ── Red accent line ── */
    #intro-accent {
      width: 0;
      height: 3px;
      background: #E11B22;
      margin: 0 auto 0;
      transition: width 0.7s cubic-bezier(0.4,0,0.2,1);
    }
    #intro-accent.visible { width: 56px; }

    /* ── Enter Site button ── */
    #intro-enter {
      margin-top: 44px;
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(9px, 1.0vw, 11px);
      font-weight: 700;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: #ffffff;
      background: transparent;
      border: 1.5px solid rgba(255,255,255,0.65);
      padding: clamp(10px, 1.5vh, 16px) clamp(28px, 4vw, 52px);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease, background 0.25s, border-color 0.25s;
    }
    #intro-enter.visible {
      opacity: 1;
      pointer-events: auto;
    }
    #intro-enter:hover {
      background: rgba(255,255,255,0.12);
      border-color: #ffffff;
    }

    /* ── LOGO ── */
    #intro-logo {
      position: fixed;
      top: clamp(20px, 3vw, 44px);
      left: clamp(20px, 3.5vw, 52px);
      z-index: 10002;
      height: clamp(40px, 5vw, 66px);
      width: auto;
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity 0.7s ease 0.15s, transform 0.7s ease 0.15s;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.55));
    }
    #intro-logo.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── SKIP button ── */
    #skip-btn {
      position: fixed;
      top: clamp(20px, 3vw, 44px);
      right: clamp(20px, 3.5vw, 52px);
      z-index: 10002;
      font-family: 'Montserrat', Arial Black, sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      background: transparent;
      border: 1px solid rgba(255,255,255,0.32);
      padding: 8px 20px;
      border-radius: 2px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.5s ease, color 0.2s, background 0.2s, border-color 0.2s;
    }
    #skip-btn.show { opacity: 1; }
    #skip-btn:hover {
      background: rgba(255,255,255,0.12);
      color: #fff;
      border-color: rgba(255,255,255,0.65);
    }

    /* ── Progress bar ── */
    #intro-prog {
      position: fixed;
      bottom: 0; left: 0;
      height: 4px;
      width: 0;
      background: #E11B22;
      z-index: 10002;
    }

    /* ── Responsive font shrink on very small screens ── */
    @media (max-width: 480px) {
      .intro-word {
        font-size: clamp(38px, 13vw, 64px);
      }
      #intro-tagline {
        font-size: 7px;
        letter-spacing: 0.12em;
      }
    }
  </style>
</head>
<body>

  <div id="intro-wrap">

    <!-- Background canvas (images + overlay gradient only) -->
    <canvas id="intro-canvas"></canvas>

    <!-- HTML text overlay -->
    <div id="intro-overlay">
      <div id="intro-words">
        <span class="intro-word" id="word-0">Belong.</span>
        <span class="intro-word" id="word-1">Grow.</span>
        <span class="intro-word" id="word-2">Succeed.</span>
      </div>
      <div id="intro-tagline">North American International School &nbsp;·&nbsp; Dubai, UAE</div>
      <div id="intro-accent"></div>
      <button id="intro-enter" aria-label="Enter site">ENTER SITE &nbsp;→</button>
    </div>

  </div>

  <!-- Real logo PNG -->
  <img src="images/nais-logo.png" alt="North American International School Dubai" id="intro-logo" />
  <button id="skip-btn" aria-label="Skip intro">SKIP &nbsp;✕</button>
  <div id="intro-prog"></div>

<script>
!function(){
  "use strict";

  var DEST     = "index.html";
  var AUTO_MS  = 7500;
  var SLIDE_MS = 3200;

  var IMG_URLS = [
    "images/school-17.jpg",
    "images/school-22.jpg",
    "images/school-19.jpg",
    "images/school-15.jpg"
  ];

  /* ── Elements ── */
  var wrap      = document.getElementById("intro-wrap");
  var canvas    = document.getElementById("intro-canvas");
  var ctx       = canvas.getContext("2d");
  var logoEl    = document.getElementById("intro-logo");
  var skipBtn   = document.getElementById("skip-btn");
  var progBar   = document.getElementById("intro-prog");
  var enterBtn  = document.getElementById("intro-enter");
  var accentEl  = document.getElementById("intro-accent");
  var taglineEl = document.getElementById("intro-tagline");
  var wordEls   = [
    document.getElementById("word-0"),
    document.getElementById("word-1"),
    document.getElementById("word-2")
  ];

  /* ── State ── */
  var W, H, DPR;
  var imgs     = [];
  var curImg   = 0;
  var nextImg  = 1;
  var blending = false;
  var blendPct = 0;
  var dismissed = false;
  var lastTs    = null;
  var raf;

  /* ── Preload images ── */
  IMG_URLS.forEach(function(url, i){
    var im = new Image();
    im.crossOrigin = "anonymous";
    im.src = url;
    imgs[i] = im;
  });

  /* ── Resize canvas ── */
  function resize(){
    DPR = window.devicePixelRatio || 1;
    var r = canvas.parentElement.getBoundingClientRect();
    W = canvas.width  = Math.round(r.width  * DPR);
    H = canvas.height = Math.round(r.height * DPR);
  }
  window.addEventListener("resize", resize);
  resize();

  /* ── Cover-fit draw ── */
  function drawImg(img, alpha){
    if(!img || !img.complete || !img.naturalWidth) return;
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
    var sc = Math.max(W / img.naturalWidth, H / img.naturalHeight);
    var dw = img.naturalWidth  * sc;
    var dh = img.naturalHeight * sc;
    ctx.drawImage(img, (W-dw)/2, (H-dh)/2, dw, dh);
    ctx.restore();
  }

  /* ── Draw background frame ── */
  function frame(ts){
    var dt = lastTs ? Math.min((ts - lastTs) / 1000, 0.05) : 0;
    lastTs = ts;

    if(blending){
      blendPct += dt / (SLIDE_MS / 1000 * 0.38);
      if(blendPct >= 1){ blendPct=1; blending=false; curImg=nextImg; }
    }

    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = "#0A0E1F";
    ctx.fillRect(0,0,W,H);

    drawImg(imgs[curImg], blending ? 1 - blendPct : 1);
    if(blending) drawImg(imgs[nextImg], blendPct);

    /* Cinematic dark overlay */
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0,    "rgba(0,0,0,0.52)");
    grad.addColorStop(0.42, "rgba(0,0,0,0.28)");
    grad.addColorStop(1,    "rgba(0,0,0,0.72)");
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    if(!dismissed) raf = requestAnimationFrame(frame);
  }

  /* ── Image cycling ── */
  setInterval(function(){
    if(dismissed) return;
    nextImg  = (curImg + 1) % imgs.length;
    blendPct = 0;
    blending = true;
  }, SLIDE_MS);

  /* ── Dismiss ── */
  function dismiss(){
    if(dismissed) return;
    dismissed = true;
    cancelAnimationFrame(raf);
    wrap.classList.add("fade-out");
    logoEl.style.opacity  = "0";
    skipBtn.style.opacity = "0";
    progBar.style.opacity = "0";
    setTimeout(function(){ window.location.href = DEST; }, 1200);
  }

  enterBtn.addEventListener("click", dismiss);
  skipBtn.addEventListener("click", dismiss);
  document.addEventListener("keydown", function(e){
    if(e.key !== "Tab" && e.key !== "Shift") dismiss();
  });

  /* ── Staggered text reveal using CSS transitions ── */
  function revealWords(){
    /* Word 0: 0.30s, Word 1: 0.58s, Word 2: 0.86s */
    setTimeout(function(){ wordEls[0].classList.add("visible"); }, 300);
    setTimeout(function(){ wordEls[1].classList.add("visible"); }, 580);
    setTimeout(function(){ wordEls[2].classList.add("visible"); }, 860);
    /* Tagline + accent: 1.14s */
    setTimeout(function(){
      taglineEl.classList.add("visible");
      accentEl.classList.add("visible");
    }, 1140);
    /* Enter button: 2.10s */
    setTimeout(function(){ enterBtn.classList.add("visible"); }, 2100);
  }

  /* ── Start ── */
  function startIntro(){
    raf = requestAnimationFrame(frame);

    requestAnimationFrame(function(){
      logoEl.classList.add("show");
    });

    /* Show skip after 2s */
    setTimeout(function(){ skipBtn.classList.add("show"); }, 2000);

    /* Progress bar */
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        progBar.style.transition = "width " + (AUTO_MS/1000).toFixed(1) + "s linear";
        progBar.style.width      = "100%";
      });
    });

    /* Auto-dismiss */
    setTimeout(dismiss, AUTO_MS);

    /* Start word reveal */
    revealWords();
  }

  startIntro();

}();
</script>

</body>
</html>
