  <script>
  (function(){
    "use strict";
    var AUTO_MS=7500,SLIDE_MS=3200,RED="#E11B22";
    var IMG_URLS=["https://images.unsplash.com/photo-1523050854058-8df90110c9f1?w=1600&q=80","https://images.unsplash.com/photo-1509062522246-3755977927d7?w=1600&q=80","https://images.unsplash.com/photo-1580582932707-520aed937b7b?w=1600&q=80","https://images.unsplash.com/photo-1571260899304-425eee4c7efc?w=1600&q=80"];
    var introEl=document.getElementById("site-intro"),canvas=document.getElementById("intro-canvas"),ctx=canvas.getContext("2d"),logoImg=document.getElementById("intro-logo-img"),skipBtn=document.getElementById("intro-skip"),progBar=document.getElementById("intro-progbar");
    var W,H,DPR,imgs=[],curImg=0,nextImg=1,blending=false,blendPct=0,word0Y=0,word1Y=0,tagA=0,accentPct=0,enterA=0,dismissed=false,autoTimer,lastTs=null,raf,t0=null;
    IMG_URLS.forEach(function(url,i){var im=new Image();im.crossOrigin="anonymous";im.src=url;imgs[i]=im;});
    function resize(){DPR=window.devicePixelRatio||1;var r=canvas.parentElement.getBoundingClientRect();W=canvas.width=Math.round(r.width*DPR);H=canvas.height=Math.round(r.height*DPR);}
    window.addEventListener("resize",resize);resize();
    function drawImg(img,alpha){if(!img||!img.complete||!img.naturalWidth)return;ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,alpha));var sc=Math.max(W/img.naturalWidth,H/img.naturalHeight);ctx.drawImage(img,(W-img.naturalWidth*sc)/2,(H-img.naturalHeight*sc)/2,img.naturalWidth*sc,img.naturalHeight*sc);ctx.restore();}
    function getFZ(){return Math.min(Math.max(W*0.125,60*DPR),190*DPR);}
    function easeOut(t){return 1-Math.pow(1-t,3);}
    function frame(ts){
      if(!t0)t0=ts;
      var dt=lastTs?Math.min((ts-lastTs)/1000,0.05):0;lastTs=ts;var el=(ts-t0)/1000;
      if(blending){blendPct+=dt/(SLIDE_MS/1000*0.38);if(blendPct>=1){blendPct=1;blending=false;curImg=nextImg;}}
      if(el>0.30)word0Y=Math.min(word0Y+dt*3.5,1);
      if(el>0.58)word1Y=Math.min(word1Y+dt*3.5,1);
      if(el>1.15)tagA=Math.min(tagA+dt*2.2,1);
      if(el>1.35)accentPct=Math.min(accentPct+dt*2.0,1);
      if(el>2.20)enterA=Math.min(enterA+dt*2.0,1);
      ctx.clearRect(0,0,W,H);ctx.fillStyle="#0A0E1F";ctx.fillRect(0,0,W,H);
      drawImg(imgs[curImg],blending?1-blendPct:1);
      if(blending)drawImg(imgs[nextImg],blendPct);
      var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"rgba(0,0,0,0.42)");g.addColorStop(.45,"rgba(0,0,0,0.18)");g.addColorStop(1,"rgba(0,0,0,0.60)");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      var fz=getFZ(),baseY=H*0.5+fz*0.32;
      ctx.font="900 "+fz+"px 'Montserrat',Arial Black,sans-serif";ctx.textBaseline="alphabetic";ctx.textAlign="left";
      var weW=ctx.measureText("WE").width,beW=ctx.measureText("BELIEVE").width,gap=fz*0.19,sx=(W-weW-gap-beW)/2;
      ctx.save();ctx.globalAlpha=word0Y;ctx.shadowColor="rgba(0,0,0,0.55)";ctx.shadowBlur=22*DPR;ctx.fillStyle="#fff";ctx.fillText("WE",sx,baseY+(1-easeOut(word0Y))*fz*1.4);ctx.restore();
      ctx.save();ctx.globalAlpha=word1Y;ctx.shadowColor="rgba(0,0,0,0.55)";ctx.shadowBlur=22*DPR;ctx.fillStyle="#fff";ctx.fillText("BELIEVE",sx+weW+gap,baseY+(1-easeOut(word1Y))*fz*1.4);ctx.restore();
      if(tagA>0.01){ctx.save();ctx.globalAlpha=tagA;ctx.font="700 "+Math.round(fz*0.080)+"px 'Montserrat',sans-serif";ctx.textAlign="center";ctx.textBaseline="alphabetic";ctx.fillStyle="rgba(255,255,255,0.78)";ctx.fillText("NORTH AMERICAN INTERNATIONAL SCHOOL  \u00B7  DUBAI, UAE",W/2,baseY+fz*0.31);ctx.restore();}
      if(accentPct>0){var lw=58*DPR*easeOut(accentPct);ctx.save();ctx.globalAlpha=tagA;ctx.fillStyle=RED;ctx.fillRect(W/2-lw/2,baseY+fz*0.48,lw,3*DPR);ctx.restore();}
      if(enterA>0.01){var bx=W/2,by=H-76*DPR,bw=218*DPR,bh=46*DPR;ctx.save();ctx.globalAlpha=enterA;ctx.strokeStyle="rgba(255,255,255,0.65)";ctx.lineWidth=1.5*DPR;ctx.strokeRect(bx-bw/2,by-bh/2,bw,bh);ctx.fillStyle="#fff";ctx.font="700 "+Math.round(fz*0.080)+"px 'Montserrat',sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("ENTER SITE  \u2192",bx,by);ctx.restore();canvas._btn={x:bx-bw/2,y:by-bh/2,w:bw,h:bh};}
      raf=requestAnimationFrame(frame);
    }
    setInterval(function(){if(dismissed)return;nextImg=(curImg+1)%imgs.length;blendPct=0;blending=true;},SLIDE_MS);
    function dismiss(){if(dismissed)return;dismissed=true;clearTimeout(autoTimer);cancelAnimationFrame(raf);introEl.classList.add("intro-out");logoImg.style.opacity="0";skipBtn.style.opacity="0";progBar.style.opacity="0";}
    canvas.addEventListener("click",function(e){if(enterA<0.45)return;var r=canvas.getBoundingClientRect();var cx=(e.clientX-r.left)*DPR,cy=(e.clientY-r.top)*DPR;var b=canvas._btn;if(!b||(cx>=b.x&&cx<=b.x+b.w&&cy>=b.y&&cy<=b.y+b.h)){dismiss();}});
    skipBtn.addEventListener("click",dismiss);
    document.addEventListener("keydown",function(e){if(e.key!=="Tab"&&e.key!=="Shift")dismiss();});
    raf=requestAnimationFrame(frame);
    requestAnimationFrame(function(){logoImg.classList.add("show");});
    setTimeout(function(){skipBtn.classList.add("show");},2000);
    requestAnimationFrame(function(){progBar.style.transition="width "+(AUTO_MS/1000).toFixed(1)+"s linear";progBar.style.width="100%";});
    autoTimer=setTimeout(dismiss,AUTO_MS);
  }());
  </script>
