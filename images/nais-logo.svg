<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 110" role="img" aria-label="North American International School – NAIS Dubai">

  <!-- ══════════════ LEFT SQUARE EMBLEM ══════════════ -->
  <!-- Outer white fill square with navy border -->
  <rect x="2" y="2" width="100" height="100" rx="3" fill="white" stroke="#1F2F6E" stroke-width="2"/>

  <!-- Top-left quadrant: navy -->
  <rect x="4" y="4" width="46" height="46" fill="#1F2F6E"/>
  <!-- Top-right quadrant: red -->
  <rect x="54" y="4" width="46" height="46" fill="#E11B22"/>
  <!-- Bottom-left quadrant: red -->
  <rect x="4" y="54" width="46" height="46" fill="#E11B22"/>
  <!-- Bottom-right quadrant: navy -->
  <rect x="54" y="54" width="46" height="46" fill="#1F2F6E"/>

  <!-- White cross dividers -->
  <rect x="49" y="4"  width="6" height="96" fill="white"/>
  <rect x="4"  y="49" width="96" height="6" fill="white"/>

  <!-- Central medallion: navy circle, white outline -->
  <circle cx="52" cy="52" r="26" fill="#1F2F6E" stroke="white" stroke-width="3"/>

  <!-- Graduation cap above eagle -->
  <rect x="46" y="28" width="12" height="3" rx="1" fill="white"/>
  <polygon points="52,24 44,30 60,30" fill="white"/>
  <line x1="52" y1="31" x2="52" y2="35" stroke="white" stroke-width="1.5"/>

  <!-- Eagle body -->
  <ellipse cx="52" cy="53" rx="5" ry="7" fill="white"/>
  <!-- Eagle head -->
  <circle cx="52" cy="41" r="4" fill="white"/>
  <!-- Beak -->
  <polygon points="55.5,41 59,43 55.5,44.5" fill="#E11B22"/>
  <!-- Left wing -->
  <path d="M28 48 Q33 35 44 44 Q42 50 36 49 Z" fill="white"/>
  <!-- Right wing -->
  <path d="M76 48 Q71 35 60 44 Q62 50 68 49 Z" fill="white"/>
  <!-- Tail feathers -->
  <path d="M48 59 L52 70 L56 59 Z" fill="white"/>
  <!-- Olive branch (left talon) -->
  <path d="M46 60 Q41 66 38 68" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <circle cx="38" cy="68" r="1.5" fill="white"/>
  <circle cx="40" cy="65" r="1.2" fill="white"/>
  <!-- Arrow (right talon) -->
  <line x1="58" y1="60" x2="65" y2="68" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="65,68 62,64 67,64" fill="white"/>

  <!-- ══════════════ RIGHT SIDE ══════════════ -->

  <!-- Arabic text -->
  <text x="556" y="26"
    font-family="'Arial','Segoe UI',sans-serif"
    font-size="13.5" font-weight="700"
    fill="#1F2F6E"
    text-anchor="end"
    direction="rtl"
    unicode-bidi="bidi-override">مدرسة نورث أميريكان انترناشونال</text>

  <!-- Flag: Navy stars box -->
  <rect x="116" y="33" width="52" height="20" fill="#1F2F6E" rx="2"/>
  <!-- Three stars -->
  <text x="121" y="48"
    font-family="Arial,sans-serif"
    font-size="13" fill="white"
    letter-spacing="9">★★★</text>

  <!-- Red stripes -->
  <rect x="172" y="33" width="382" height="9"  fill="#E11B22" rx="1.5"/>
  <rect x="172" y="44" width="382" height="9"  fill="#E11B22" rx="1.5"/>

  <!-- NORTH AMERICAN -->
  <text x="116" y="78"
    font-family="'Montserrat','Arial Black','Arial',sans-serif"
    font-size="26" font-weight="900"
    fill="#1F2F6E"
    letter-spacing="2">NORTH AMERICAN</text>

  <!-- INTERNATIONAL SCHOOL -->
  <text x="116" y="100"
    font-family="'Montserrat','Arial',sans-serif"
    font-size="15.5" font-weight="700"
    fill="#1F2F6E"
    letter-spacing="4">INTERNATIONAL SCHOOL</text>

</svg>
